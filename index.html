const $=s=>document.querySelector(s);
let mode="cards",index=0,flipped=false,answer="",feedback=null;
let sortMode="freq", order=[], levelFilter="all";
const frequencyOrder=[1,2,9,5,7,8,0,3,4,6]; // このサンプル10語の学習優先度の目安
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function applySort(mode){sortMode=mode;let all=words.map((_,i)=>i);if(mode==="random")all=shuffle(all);else if(mode==="abc")all.sort((a,b)=>words[a].en.localeCompare(words[b].en));else all.sort((a,b)=>(words[a].level||3)-(words[b].level||3)||a-b);order=levelFilter==="all"?all:all.filter(i=>(words[i].level||3)===Number(levelFilter));index=0;flipped=false;answer="";feedback=null;render()}
function currentIndex(){return order[index]??0}
let state={known:[],missed:[],studied:[]};
try{state={...state,...JSON.parse(localStorage.getItem("aqua-vocab-progress")||"{}")}}catch(e){}
function save(){localStorage.setItem("aqua-vocab-progress",JSON.stringify(state));renderStats()}
function renderStats(){$("#knownCount").textContent=state.known.length;$("#missedCount").textContent=state.missed.length;$("#studiedCount").textContent=state.studied.length}
function setMode(m){mode=m;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
function current(){return words[currentIndex()]}
function sortHTML(){return `<div class="sortbar"><span>並び順</span><button data-sort="freq" class="${sortMode==='freq'?'selected':''}">⭐ 優先順</button><button data-sort="random" class="${sortMode==='random'?'selected':''}">🔀 ランダム</button><button data-sort="abc" class="${sortMode==='abc'?'selected':''}">ABC順</button></div><div class="sortbar"><span>レベル</span><button data-level="all" class="${levelFilter==='all'?'selected':''}">すべて</button><button data-level="1" class="${levelFilter==='1'?'selected':''}">① 最重要</button><button data-level="2" class="${levelFilter==='2'?'selected':''}">② 頻出</button><button data-level="3" class="${levelFilter==='3'?'selected':''}">③ 標準</button><button data-level="4" class="${levelFilter==='4'?'selected':''}">④ 発展</button></div>`}
function visualHTML(w){
 const art={
  alleviate:`<path d="M42 73h56M70 45v56"/><path d="M54 54l32 32M86 54L54 86"/><path d="M112 40c12 9 18 19 18 30a18 18 0 0 1-36 0c0-11 7-21 18-30Z"/><path d="M145 54l7 7 14-17"/>`,
  inevitable:`<circle cx="76" cy="65" r="31"/><path d="M76 44v23l15 9M119 65h38m-10-10 10 10-10 10"/><path d="M54 27l-5-8m54 8 5-8"/>`,
  substantial:`<path d="M43 98V72h22v26M78 98V53h22v45M113 98V32h22v66"/><path d="M39 101h105M149 42l9-10 9 10"/>`,
  deteriorate:`<path d="M88 96V62m0 12L65 52m23 31 24-25"/><path d="M65 52c-2-17-19-20-27-12 1 15 12 23 27 12Zm23 11c1-17 18-21 27-12-1 15-12 24-27 12Z"/><path d="M47 98h82M52 109h72"/><path d="m130 33 9 9-9 9"/>`,
  profound:`<path d="M37 42c18-17 37-17 55 0s37 17 55 0"/><path d="M37 63c18-17 37-17 55 0s37 17 55 0"/><path d="M37 84c18-17 37-17 55 0s37 17 55 0"/><path d="M92 29v73m-9-9 9 9 9-9"/>`,
  obstacle:`<path d="M39 96V57h27v39m0-27h27v27m0-39h27v39"/><path d="M30 105h105M147 80l13-13 13 13m-13-13v38"/>`,
  consecutive:`<rect x="45" y="35" width="94" height="67" rx="9"/><path d="M45 53h94M67 26v18m50-18v18"/><path d="M62 68h9m12 0h9m12 0h9m-49 17h9m12 0h9m12 0h9"/>`,
  reluctant:`<circle cx="86" cy="47" r="17"/><path d="M55 101c3-22 15-33 31-33s28 11 31 33"/><path d="M126 42h30m-8-8 8 8-8 8M43 35l-10-7m10 7-10 7"/>`,
  controversial:`<path d="M38 39h67a9 9 0 0 1 9 9v24a9 9 0 0 1-9 9H69l-16 12v-12h-6a9 9 0 0 1-9-9V48a9 9 0 0 1 9-9Z"/><path d="M93 63h49a9 9 0 0 1 9 9v19a9 9 0 0 1-9 9h-7v10l-14-10H93"/><path d="M57 57h29m-29 12h19m29 8h29"/>`,
  implement:`<circle cx="88" cy="68" r="29"/><circle cx="88" cy="68" r="10"/><path d="M88 29v12m0 54v12M49 68h12m54 0h12M60 40l9 9m38 38 9 9m0-56-9 9M69 87l-9 9"/><path d="m78 68 7 7 15-17"/>`
 };
 const labels={alleviate:'痛み・負担が軽くなる',inevitable:'避けられず起こる',substantial:'量や規模がかなり大きい',deteriorate:'状態が悪くなる',profound:'深く、大きな影響',obstacle:'進むのをさえぎる壁',consecutive:'途切れず連続する',reluctant:'気が進まずためらう',controversial:'賛否が分かれて議論になる',implement:'計画を実行に移す'};
 return art[w.en]? `<div class="visual" role="img" aria-label="${labels[w.en]||w.ja}"><svg viewBox="0 0 190 125" fill="none" stroke="#58aeda" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="95" cy="63" r="57" stroke="#c5eafa" stroke-width="2" stroke-dasharray="4 7"/>${art[w.en]}<circle cx="153" cy="24" r="4" fill="#9bdcf5" stroke="none"/><path d="M29 104l4-4m0 4-4-4" stroke="#9bdcf5" stroke-width="3"/></svg></div><div class="visual-caption">✧ ${labels[w.en]||w.ja} ✧</div>` : `<div class="visual" role="img" aria-label="${w.ja}"><div style="font-size:54px;filter:drop-shadow(0 3px 2px #b8e3f5)">${w.icon||"✧"}</div></div><div class="visual-caption">✧ ${w.ja} ✧</div>`;
}
function cardHTML(){let w=current();return `${sortHTML()}<div class="topline"><span>WORD CARD</span><span>${index+1} / ${order.length}</span></div><div class="card" id="flipCard" role="button" tabindex="0" aria-label="単語カードをめくる">${flipped?`<span class="hint">MEANING ♡</span><div class="meaning">${w.ja}</div>${visualHTML(w)}<div class="pos">${w.en}</div><div class="example">${w.ex}</div><div class="translation">${w.tr}</div>`:`<span class="hint">TAP TO FLIP ✧</span><div class="word">${w.en}</div><div class="pos">${w.pos}</div><span class="hint">タップして意味を確認</span>`}</div><div class="btnrow"><button class="btn" id="prev" ${index===0?"disabled":""}>前へ</button><button class="btn primary" id="flip">${flipped?"表に戻す ↻":"カードをめくる ♡"}</button><button class="btn" id="next">次へ →</button></div>`}
function quizHTML(){let w=current();return `${sortHTML()}<div class="topline"><span>WRITE THE MEANING ✎</span><span>${index+1} / ${order.length}</span></div><div class="card" style="min-height:150px;cursor:default"><div class="word">${w.en}</div><div class="pos">${w.pos}</div></div><label class="inputlabel" for="answer">この単語の意味を日本語で入力！</label><input id="answer" class="answer" placeholder="意味を入力してね..." autocomplete="off" value="${escapeHTML(answer)}"><div class="btnrow"><button class="btn primary" id="check" ${feedback?"disabled":""}>答え合わせ ♡</button></div>${feedback?`<div class="feedback ${feedback.ok?"good":"bad"}"><strong>${feedback.ok?"○ 正解！！":"× 不正解"}</strong><br>${feedback.ok?"いい感じ！意味を覚えられてるね。":"正しい意味を確認しよう！"}<br><b>${w.ja}</b>${visualHTML(w)}</div><div class="note"><b>例文</b><br>${w.ex}<br><span class="translation">${w.tr}</span></div><div class="btnrow"><button class="btn primary" id="nextQuiz">次の問題へ →</button></div>`:""}`}
function reviewHTML(){if(!state.missed.length)return `<div class="empty"><div style="font-size:35px">✧</div><b>まだ苦手単語はないよ！</b><br><small>テストに挑戦してみよう。</small></div>`;return `<div class="topline"><span>♡ REVIEW WORDS</span><span>${state.missed.length} WORDS</span></div>`+state.missed.map(i=>`<div class="review-item"><div><strong>${words[i].en}</strong><small>${words[i].ja}</small></div><button data-review="${i}">復習する →</button></div>`).join("")}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){renderStats();$("#content").innerHTML=mode==="cards"?cardHTML():mode==="quiz"?quizHTML():reviewHTML();
 document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>applySort(b.dataset.sort));
 document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{levelFilter=b.dataset.level;applySort(sortMode)});
 if(mode==="cards"){$("#flipCard").onclick=()=>{flipped=!flipped;render()};$("#flipCard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipped=!flipped;render()}};$("#flip").onclick=()=>{flipped=!flipped;render()};$("#prev").onclick=()=>{if(index>0){index--;flipped=false;render()}};$("#next").onclick=next}
 if(mode==="quiz"){$("#answer")?.addEventListener("input",e=>answer=e.target.value);$("#check")?.addEventListener("click",check);$("#nextQuiz")?.addEventListener("click",next)}
 if(mode==="review")document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>{const id=Number(b.dataset.review);index=order.indexOf(id);if(index<0){applySort("freq");index=order.indexOf(id)}setMode("cards")})
}
function check(){let w=current(),wordId=currentIndex(),a=answer.trim().replace(/\s/g,"");if(!a){$("#answer").focus();return}let normalized=a.replace(/[。、！!？?]/g,"");let ok=w.syn.some(s=>normalized.includes(s.replace(/\s/g,""))||s.replace(/\s/g,"").includes(normalized));feedback={ok};if(!state.studied.includes(wordId))state.studied.push(wordId);if(ok){if(!state.known.includes(wordId))state.known.push(wordId);state.missed=state.missed.filter(i=>i!==wordId)}else if(!state.missed.includes(wordId))state.missed.push(wordId);save();render()}
function next(){index=(index+1)%order.length;flipped=false;answer="";feedback=null;render()}
applySort("freq");
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
